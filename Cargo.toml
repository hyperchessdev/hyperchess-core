[workspace]
resolver = "2"
members = [
    "crates/*",
]
exclude = [
    # hyperchess-search-cuda depends on local, unpublished rust-cuda paths and is
    # never part of the default build/test/publish set — see §5 of the extraction plan.
    "crates/hyperchess-search-cuda",
]

[workspace.package]
edition = "2021"
license = "GPL-3.0-or-later"
# Public home (crates.io metadata). Day-to-day development also runs on a
# private GitLab; the GitHub repo is the canonical open-source location.
repository = "https://github.com/hyperchessdev/hyperchess-core"
homepage = "https://github.com/hyperchessdev/hyperchess-core"
