[package]
name = "hyperchess-rules"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "HyperChess board representation, move generation, and legality — a 12x12 chess variant with Eagle and Hawk pieces"
repository.workspace = true
homepage.workspace = true
readme = "docs/README.md"
keywords = ["chess", "chess-variant", "board-game", "hyperchess"]
categories = ["games", "game-engines"]

[features]
# Historically this pulled getrandom's "js" feature for wasm32 builds because
# `rand` was a runtime dependency. The engine is now zero-dependency (`rand`
# is dev-only, randomness comes from tools/prng.rs), so the feature is an
# intentional no-op — kept because hyperchess-search and hyperchess-wasm
# forward "hyperchess-rules/wasm" and removing it would break their builds.
wasm = []

# ZERO external dependencies — a deliberate guarantee (see README "Zero
# dependencies"). Randomness: tools/prng.rs (XorShift64*). Lazy statics:
# std::sync::LazyLock. Do not add crates here without a very strong reason.
[dependencies]
hyperchess-eval = { path = "../hyperchess-eval", version = "0.1.0" }

[dev-dependencies]
# Tests only (random-game termination fuzzing); never ships.
rand = "0.8"

# NOTE vs. the source repo's src/hyperchess/Cargo.toml: rayon, num_cpus,
# wasm-bindgen, console_error_panic_hook, and js-sys are all dropped.
# Verified that nothing outside src/bots/ and src/wasm.rs references any of
# them — both live elsewhere now (hyperchess-search and hyperchess-wasm
# respectively, per the extraction plan's component table), so this crate
# never needed them. Also dropped `crate-type = ["cdylib", "rlib"]` — that
# was for wasm-pack building this crate directly (via wasm.rs, which no
# longer lives here); the default rlib is all a workspace dependency needs.
# hyperchess-wasm picks up cdylib later.
