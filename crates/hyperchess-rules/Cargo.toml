[package]
name = "hyperchess-rules"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "HyperChess board representation, move generation, and legality — a 12x12 chess variant with Eagle and Hawk pieces"

[features]
# `rand::thread_rng()` (used in board/mod.rs's zobrist test and elsewhere)
# pulls in getrandom transitively; getrandom refuses to build for
# wasm32-unknown-unknown without its "js" feature. This crate's own code
# never names `getrandom` directly, but declaring it here as an optional dep
# with features=["js"] and enabling it under this feature unifies that
# feature across the whole dependency graph (the same reason the source
# repo's Cargo.toml carried it). Found empirically: dropped in the initial
# Phase 1 pass, then verifying hyperchess-search's own wasm32 build caught
# the gap — see docs/hyperchess-core-extraction-plan.md §12 Phase 3.
wasm = ["dep:getrandom"]

[dependencies]
hyperchess-eval = { path = "../hyperchess-eval" }
bitflags = "2"
rand = "0.8"
lazy_static = "1"
getrandom = { version = "0.2", features = ["js"], optional = true }

# NOTE vs. the source repo's src/hyperchess/Cargo.toml: rayon, num_cpus,
# wasm-bindgen, console_error_panic_hook, and js-sys are all dropped.
# Verified that nothing outside src/bots/ and src/wasm.rs references any of
# them — both live elsewhere now (hyperchess-search and hyperchess-wasm
# respectively, per the extraction plan's component table), so this crate
# never needed them. Also dropped `crate-type = ["cdylib", "rlib"]` — that
# was for wasm-pack building this crate directly (via wasm.rs, which no
# longer lives here); the default rlib is all a workspace dependency needs.
# hyperchess-wasm picks up cdylib later.
