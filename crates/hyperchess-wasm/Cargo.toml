[package]
name = "hyperchess-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "HyperChess WASM bindings — WasmBoard (rules+search, from src/hyperchess/src/wasm.rs) and Scene3D (WebGPU/WebGL board renderer, from the former standalone hyperchess_3d crate), one wasm-pack build target"
repository.workspace = true
homepage.workspace = true
readme = "docs/README.md"
keywords = ["chess", "wasm", "webgpu", "hyperchess"]
categories = ["games", "wasm"]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "gen_assets"
path = "src/bin/gen_assets.rs"

# wasm-pack tries to download a Binaryen binary for this pass and fails in
# offline/sandboxed environments — same reason as hyperchess-rules/
# hyperchess-search's source (src/hyperchess/Cargo.toml, src/hyperchess_3d/Cargo.toml).
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dependencies]
# geometry/pieces (native-buildable, used by gen_assets) only need these two.
glam = "0.29"
bytemuck = { version = "1", features = ["derive"] }
log = "0.4"

# Everything below is target-gated: board/camera/gpu/obj/scene are all
# #[cfg(target_arch = "wasm32")] in lib.rs, so none of this — including
# hyperchess-rules/hyperchess-search themselves — is pulled into the native
# gen_assets build. Verified empirically: gen_assets only imports
# `hyperchess_3d::pieces` (now `hyperchess_wasm::pieces`), nothing chess-engine
# related.
[target.'cfg(target_arch = "wasm32")'.dependencies]
hyperchess-rules = { path = "../hyperchess-rules", version = "0.1.0", features = ["wasm"] }
hyperchess-search = { path = "../hyperchess-search", version = "0.1.0", features = ["wasm"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
console_log = "1"
js-sys = "0.3"
getrandom = { version = "0.2", features = ["js"] }
wgpu = { version = "30", default-features = false, features = ["wgsl", "webgpu", "webgl"] }

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = [
  "Window",
  "Document",
  "HtmlCanvasElement",
  "Element",
  "DomRect",
  "console",
  "Performance",
  "VideoFrame",
]

# NOTE vs. the source repo: `pollster` (present in hyperchess_3d/Cargo.toml)
# is dropped — verified via grep that nothing actually references it.
