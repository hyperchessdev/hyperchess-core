[package]
name = "hyperchess-driver"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "HyperChess driver — CLI (engine-vs-engine games, PNG/export) and native UCI server, one `hyperchess` binary with subcommands"
repository.workspace = true
homepage.workspace = true
readme = "docs/README.md"
keywords = ["chess", "uci", "cli", "hyperchess"]
categories = ["games", "command-line-utilities"]

[[bin]]
name = "hyperchess"
path = "src/main.rs"

[features]
default = []
# Turns on hyperchess-search-cuda's own cuda feature too (it's a no-op/empty
# crate without it — see that crate's docs) and pulls in `cust` for the
# gpu-info subcommand's direct device queries.
cuda = ["dep:hyperchess-search-cuda", "hyperchess-search-cuda/cuda", "dep:cust"]

[dependencies]
hyperchess-rules = { path = "../hyperchess-rules", version = "0.1.0" }
hyperchess-search = { path = "../hyperchess-search", version = "0.1.0" }
hyperchess-search-cuda = { path = "../hyperchess-search-cuda", optional = true }

clap = { version = "4", features = ["derive"] }
rand = { version = "0.8", features = ["small_rng"] }
rayon = "1.10"
num_cpus = "1"
chrono = "0.4"
image = "0.25"
imageproc = "0.25"
ab_glyph = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
axum = "0.8"
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }

cust = { path = "/projects/github/rust-cuda/crates/cust", optional = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
